
services:
  - type: web
    name: smart-food-demand-mlops
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health

    envVars:
      - key: DATA_DIR
        value: /tmp/data

      - key: MLFLOW_TRACKING_URI
        value: http://127.0.0.1:5000

      - key: MODEL_URI
        value: models:/SmartFoodDemandModel/1

      - key: API_URL
        value: http://127.0.0.1:8000

      - key: MONGODB_DATABASE
        value: food_demand

      - key: MONGODB_URI
        sync: false
